<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gin Rummy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="room">
      <div class="table">
        <header class="sign">
          <p class="suits" aria-hidden="true">
            <span>♠</span><span class="red">♥</span><span class="red">♦</span><span>♣</span>
          </p>
          <h1>GIN RUMMY</h1>
          <p class="tag">KNOCK · MELD · GIN</p>
        </header>

        <div class="monitor">
          <div class="monitor-top">
            <span class="brand">GIN RUMMY</span>
            <span class="power"><i class="led" aria-hidden="true"></i> PWR</span>
          </div>
          <div class="screen-bezel">
            <div class="screen">
              <div id="terminal"></div>
              <div class="glass" aria-hidden="true"></div>
            </div>
          </div>
          <div class="monitor-chin">
            <span>STDIO · <span class="cols">80 COL</span></span>
          </div>
        </div>

        <footer>
          Created by <a href="https://github.com/vlmlee">mlee</a>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
